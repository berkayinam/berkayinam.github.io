<line class="arr" x1="410" y1="230" x2="478" y2="230" marker-end="url(#arrow)"/>
<line class="arr" x1="410" y1="260" x2="478" y2="260" marker-end="url(#arrow)"/>
<line class="arr" x1="410" y1="290" x2="478" y2="290" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="480" y="98" width="160" height="24" rx="4"/><text class="ts" x="560" y="114" text-anchor="middle">Turbo fan 12V (giriş)</text></g>
<rect class="box" x="480" y="128" width="160" height="24" rx="4" stroke-dasharray="4 3"/><text class="ts" x="560" y="144" text-anchor="middle">boş</text>
<g class="c-red"><rect x="480" y="158" width="160" height="24" rx="4"/><text class="ts" x="560" y="174" text-anchor="middle">LED sürücü — 220V</text></g>
<g class="c-coral"><rect x="480" y="188" width="160" height="24" rx="4"/><text class="ts" x="560" y="204" text-anchor="middle">Peltier 12V (ayrı kablo)</text></g>
<g class="c-coral"><rect x="480" y="218" width="160" height="24" rx="4"/><text class="ts" x="560" y="234" text-anchor="middle">Peltier sıcak fanı 12V</text></g>
<g class="c-teal"><rect x="480" y="248" width="160" height="24" rx="4"/><text class="ts" x="560" y="264" text-anchor="middle">PTC ısıtıcı 5V</text></g>
<g class="c-coral"><rect x="480" y="278" width="160" height="24" rx="4"/><text class="ts" x="560" y="294" text-anchor="middle">Uyku fanı 12V</text></g>
