<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 610" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>İki kutu kontrol devresi bağlantı şeması</title><desc>ESP32 pinlerinden 8 kanallı röle girişlerine, rölelerden yüklere bağlantılar; altta güç baraları ve sensör pinleri.</desc><style>
text{font-family:Inter,-apple-system,"Segoe UI",Arial,sans-serif}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.box{fill:#fff;stroke:#B4B2A9;stroke-width:0.5}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.leader{stroke:#888780;stroke-width:0.5;stroke-dasharray:3 3;fill:none}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.5}.c-purple>text.t,.c-purple>text.th{fill:#3C3489}.c-purple>text.ts{fill:#534AB7}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.5}.c-teal>text.t,.c-teal>text.th{fill:#085041}.c-teal>text.ts{fill:#0F6E56}
.c-coral>rect{fill:#FAECE7;stroke:#993C1D;stroke-width:0.5}.c-coral>text.t,.c-coral>text.th{fill:#712B13}.c-coral>text.ts{fill:#993C1D}
.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.5}.c-gray>text.t,.c-gray>text.th{fill:#444441}.c-gray>text.ts{fill:#5F5E5A}
.c-red>rect{fill:#FCEBEB;stroke:#A32D2D;stroke-width:0.5}.c-red>text.t,.c-red>text.th{fill:#791F1F}.c-red>text.ts{fill:#A32D2D}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="box" x="40" y="60" width="150" height="290" rx="4"/>
<text class="th" x="115" y="84" text-anchor="middle">ESP32</text>
<rect class="box" x="260" y="60" width="150" height="290" rx="4"/>
<text class="th" x="335" y="84" text-anchor="middle">8 kanal röle</text>
<text class="ts" x="560" y="84" text-anchor="middle">Yük (+ ucu)</text>
<text class="ts" x="180" y="114" text-anchor="end">GPIO26</text>
<text class="ts" x="180" y="144" text-anchor="end">—</text>
<text class="ts" x="180" y="174" text-anchor="end">GPIO25</text>
<text class="ts" x="180" y="204" text-anchor="end">GPIO32</text>
<text class="ts" x="180" y="234" text-anchor="end">GPIO33</text>
<text class="ts" x="180" y="264" text-anchor="end">GPIO16</text>
<text class="ts" x="180" y="294" text-anchor="end">GPIO17</text>
<text class="ts" x="180" y="324" text-anchor="end">—</text>
<text class="ts" x="272" y="114">IN1</text><text class="ts" x="398" y="114" text-anchor="end">COM → NO</text>
<text class="ts" x="272" y="144">IN2</text><text class="ts" x="398" y="144" text-anchor="end">boş</text>
<text class="ts" x="272" y="174">IN3</text><text class="ts" x="398" y="174" text-anchor="end">COM → NO</text>
<text class="ts" x="272" y="204">IN4</text><text class="ts" x="398" y="204" text-anchor="end">COM → NO</text>
<text class="ts" x="272" y="234">IN5</text><text class="ts" x="398" y="234" text-anchor="end">COM → NO</text>
<text class="ts" x="272" y="264">IN6</text><text class="ts" x="398" y="264" text-anchor="end">COM → NO</text>
<text class="ts" x="272" y="294">IN7</text><text class="ts" x="398" y="294" text-anchor="end">COM → NO</text>
<text class="ts" x="272" y="324">IN8</text><text class="ts" x="398" y="324" text-anchor="end">boş</text>
<line class="arr" x1="190" y1="110" x2="258" y2="110" marker-end="url(#arrow)"/>
<line class="arr" x1="190" y1="170" x2="258" y2="170" marker-end="url(#arrow)"/>
<line class="arr" x1="190" y1="200" x2="258" y2="200" marker-end="url(#arrow)"/>
