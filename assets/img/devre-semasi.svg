<g class="c-gray"><rect x="40" y="394" width="150" height="50" rx="4"/><text class="th" x="115" y="414" text-anchor="middle">ATX PSU</text><text class="ts" x="115" y="432" text-anchor="middle">yeşil–siyah köprülü</text></g>
<g class="c-coral"><rect x="210" y="394" width="140" height="50" rx="4"/><text class="th" x="280" y="414" text-anchor="middle">12V (sarı)</text><text class="ts" x="280" y="432" text-anchor="middle">fan röleleri</text></g>
<g class="c-teal"><rect x="370" y="394" width="140" height="50" rx="4"/><text class="th" x="440" y="414" text-anchor="middle">5V (kırmızı)</text><text class="ts" x="440" y="432" text-anchor="middle">ESP32, röle, PTC</text></g>
<g class="c-gray"><rect x="528" y="394" width="112" height="50" rx="4"/><text class="th" x="584" y="414" text-anchor="middle">GND (siyah)</text><text class="ts" x="584" y="432" text-anchor="middle">tüm eksiler</text></g>
<text class="ts" x="40" y="478">Sensörler (hepsi 3.3V ile beslenir)</text>
<g class="c-gray"><rect x="40" y="488" width="180" height="50" rx="4"/><text class="th" x="130" y="508" text-anchor="middle">SHT31 (iç)</text><text class="ts" x="130" y="526" text-anchor="middle">SDA 21 · SCL 22</text></g>
<g class="c-gray"><rect x="240" y="488" width="180" height="50" rx="4"/><text class="th" x="330" y="508" text-anchor="middle">DHT22 #1 (dış)</text><text class="ts" x="330" y="526" text-anchor="middle">DATA → GPIO13</text></g>
<g class="c-gray"><rect x="440" y="488" width="180" height="50" rx="4"/><text class="th" x="530" y="508" text-anchor="middle">DHT22 #2 (uyku)</text><text class="ts" x="530" y="526" text-anchor="middle">DATA → GPIO14</text></g>
<rect x="40" y="562" width="14" height="14" rx="3" fill="#F0997B" stroke="#993C1D" stroke-width="0.5"/><text class="ts" x="62" y="574">12V hat</text>
<rect x="140" y="562" width="14" height="14" rx="3" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.5"/><text class="ts" x="162" y="574">5V hat</text>
<rect x="230" y="562" width="14" height="14" rx="3" fill="#F09595" stroke="#A32D2D" stroke-width="0.5"/><text class="ts" x="252" y="574">220V — dikkat</text>
<rect class="box" x="370" y="562" width="14" height="14" rx="3" stroke-dasharray="3 2"/><text class="ts" x="392" y="574">boş kanal</text>
