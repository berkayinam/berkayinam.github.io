<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Çiçeklenme kutusu üstten görünüş</title><desc>Dış 80 × 50 cm strafor kutu, iç 70 × 40 cm hazne ve ortasında 50 × 30 cm ekim teknesi; teknenin iki ucunda 10 cm, yanlarında 5 cm hava boşluğu.</desc><style>
text{font-family:Inter,-apple-system,"Segoe UI",Arial,sans-serif}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.box{fill:#fff;stroke:#B4B2A9;stroke-width:0.5}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.leader{stroke:#888780;stroke-width:0.5;stroke-dasharray:3 3;fill:none}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.5}.c-purple>text.t,.c-purple>text.th{fill:#3C3489}.c-purple>text.ts{fill:#534AB7}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.5}.c-teal>text.t,.c-teal>text.th{fill:#085041}.c-teal>text.ts{fill:#0F6E56}
.c-coral>rect{fill:#FAECE7;stroke:#993C1D;stroke-width:0.5}.c-coral>text.t,.c-coral>text.th{fill:#712B13}.c-coral>text.ts{fill:#993C1D}
.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.5}.c-gray>text.t,.c-gray>text.th{fill:#444441}.c-gray>text.ts{fill:#5F5E5A}
.c-red>rect{fill:#FCEBEB;stroke:#A32D2D;stroke-width:0.5}.c-red>text.t,.c-red>text.th{fill:#791F1F}.c-red>text.ts{fill:#A32D2D}
</style>
<text class="th" x="40" y="30">Çiçeklenme kutusu, üstten görünüş (1 cm = 5 px)</text>
<rect x="140" y="45" width="400" height="250" rx="2" fill="#D3D1C7" stroke="#888780" stroke-width="0.5"/>
<rect x="165" y="70" width="350" height="200" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="2"/>
<rect x="215" y="95" width="250" height="150" rx="4" fill="#444441"/>
<text class="th" x="340" y="166" text-anchor="middle" style="fill:#F1EFE8">ekim teknesi</text>
<text class="ts" x="340" y="186" text-anchor="middle" style="fill:#D3D1C7">50 × 30 × 20 cm</text>
<text class="ts" x="190" y="174" text-anchor="middle">10 cm</text>
<text class="ts" x="490" y="174" text-anchor="middle">10 cm</text>
<text class="ts" x="340" y="87" text-anchor="middle">5 cm</text>
<text class="ts" x="340" y="262" text-anchor="middle">5 cm</text>
<text class="ts" x="40" y="330">Dış: 80 × 50 × 60 cm, 5 cm karbonlu EPS (5 levha, 50 × 100 cm)</text>
<text class="ts" x="40" y="350">İç hazne: 70 × 40 × 50 cm, iç yüzey alüminyum parlak bant</text>
<text class="ts" x="40" y="370">Kapak: dışa basan, 10 cm etekli (iç yüksekliği daraltmaz)</text>
</svg>
