<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 690" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Safran AR-GE sisteminin genel görünümü</title><desc>ATX güç kaynağı, ESP32 beyin, 8 kanal röle, çiçeklenme ve uyku kutuları ile ileride kurulacak CAN-BUS STM32 düğüm mimarisi.</desc><style>
text{font-family:Inter,-apple-system,"Segoe UI",Arial,sans-serif}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.box{fill:#fff;stroke:#B4B2A9;stroke-width:0.5}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.leader{stroke:#888780;stroke-width:0.5;stroke-dasharray:3 3;fill:none}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.5}.c-purple>text.t,.c-purple>text.th{fill:#3C3489}.c-purple>text.ts{fill:#534AB7}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.5}.c-teal>text.t,.c-teal>text.th{fill:#085041}.c-teal>text.ts{fill:#0F6E56}
.c-coral>rect{fill:#FAECE7;stroke:#993C1D;stroke-width:0.5}.c-coral>text.t,.c-coral>text.th{fill:#712B13}.c-coral>text.ts{fill:#993C1D}
.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.5}.c-gray>text.t,.c-gray>text.th{fill:#444441}.c-gray>text.ts{fill:#5F5E5A}
.c-red>rect{fill:#FCEBEB;stroke:#A32D2D;stroke-width:0.5}.c-red>text.t,.c-red>text.th{fill:#791F1F}.c-red>text.ts{fill:#A32D2D}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="250" y="40" width="180" height="56" rx="4"/><text class="th" x="340" y="63" text-anchor="middle">Telefon / tarayıcı</text><text class="ts" x="340" y="82" text-anchor="middle">safran.local paneli</text></g>
<line class="arr" x1="340" y1="96" x2="340" y2="126" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="40" y="130" width="150" height="56" rx="4"/><text class="th" x="115" y="153" text-anchor="middle">ATX PSU</text><text class="ts" x="115" y="172" text-anchor="middle">12V · 5V · GND</text></g>
<g class="c-purple"><rect x="230" y="130" width="220" height="56" rx="4"/><text class="th" x="340" y="153" text-anchor="middle">ESP32 — sistemin beyni</text><text class="ts" x="340" y="172" text-anchor="middle">WiFi + web panel + kontrol</text></g>
<g class="c-teal"><rect x="490" y="130" width="150" height="56" rx="4"/><text class="th" x="565" y="153" text-anchor="middle">DHT22 — dış hava</text><text class="ts" x="565" y="172" text-anchor="middle">GPIO13</text></g>
<line class="arr" x1="190" y1="158" x2="228" y2="158" marker-end="url(#arrow)"/>
<line class="arr" x1="490" y1="158" x2="452" y2="158" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="186" x2="340" y2="226" marker-end="url(#arrow)"/>
<path class="arr" d="M115 186 L115 255 L228 255" fill="none" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="230" y="230" width="220" height="50" rx="4"/><text class="th" x="340" y="251" text-anchor="middle">8 kanal röle</text><text class="ts" x="340" y="269" text-anchor="middle">7 kanal kullanımda</text></g>
<path class="arr" d="M300 280 L300 305 L185 305 L185 326" fill="none" marker-end="url(#arrow)"/>
<path class="arr" d="M380 280 L380 305 L495 305 L495 326" fill="none" marker-end="url(#arrow)"/>
<rect class="box" x="40" y="330" width="290" height="160" rx="6" stroke-dasharray="5 4"/>
<text class="th" x="55" y="354">Kutu 1 — Çiçeklenme</text>
<g class="c-teal"><rect x="50" y="368" width="130" height="44" rx="4"/><text class="t" x="115" y="395" text-anchor="middle">SHT31 (iç iklim)</text></g>
<g class="c-coral"><rect x="190" y="368" width="130" height="44" rx="4"/><text class="t" x="255" y="395" text-anchor="middle">Peltier + fanlar</text></g>
<g class="c-coral"><rect x="50" y="424" width="130" height="44" rx="4"/><text class="t" x="115" y="451" text-anchor="middle">Turbo giriş fanı</text></g>
<g class="c-coral"><rect x="190" y="424" width="130" height="44" rx="4"/><text class="t" x="255" y="451" text-anchor="middle">LED armatür</text></g>
<rect class="box" x="350" y="330" width="290" height="160" rx="6" stroke-dasharray="5 4"/>
<text class="th" x="365" y="354">Kutu 2 — Uyku (dormansi)</text>
<g class="c-teal"><rect x="360" y="368" width="130" height="44" rx="4"/><text class="t" x="425" y="395" text-anchor="middle">DHT22 (iç)</text></g>
<g class="c-coral"><rect x="500" y="368" width="130" height="44" rx="4"/><text class="t" x="565" y="395" text-anchor="middle">PTC + 40 mm fan</text></g>
<text class="ts" x="365" y="446">Hedef ≥ 25 °C, kuru ve karanlık</text>
<text class="ts" x="40" y="516">Sensörler doğrudan ESP32 pinlerine, eyleyiciler rölelere bağlı.</text>
<rect class="box" x="40" y="532" width="600" height="100" rx="6" stroke-dasharray="5 4"/>
<text class="th" x="55" y="554">Gelecek: CAN-BUS düğüm mimarisi</text>
<g class="c-purple"><rect x="55" y="566" width="130" height="40" rx="4" stroke-dasharray="4 3"/><text class="t" x="120" y="591" text-anchor="middle">ESP32 (master)</text></g>
<g class="c-gray"><rect x="200" y="566" width="130" height="40" rx="4" stroke-dasharray="4 3"/><text class="t" x="265" y="591" text-anchor="middle">STM32 — Hasat 1</text></g>
<g class="c-gray"><rect x="345" y="566" width="130" height="40" rx="4" stroke-dasharray="4 3"/><text class="t" x="410" y="591" text-anchor="middle">STM32 — Hasat 2</text></g>
<g class="c-gray"><rect x="490" y="566" width="140" height="40" rx="4" stroke-dasharray="4 3"/><text class="t" x="560" y="591" text-anchor="middle">STM32 — Dormansi</text></g>
<line x1="120" y1="606" x2="120" y2="620" stroke="#888780" stroke-width="1.5"/>
<line x1="265" y1="606" x2="265" y2="620" stroke="#888780" stroke-width="1.5"/>
<line x1="410" y1="606" x2="410" y2="620" stroke="#888780" stroke-width="1.5"/>
<line x1="560" y1="606" x2="560" y2="620" stroke="#888780" stroke-width="1.5"/>
<line x1="120" y1="620" x2="560" y2="620" stroke="#888780" stroke-width="1.5"/>
<rect x="40" y="652" width="14" height="14" rx="3" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.5"/><text class="ts" x="62" y="664">kontrol</text>
<rect x="130" y="652" width="14" height="14" rx="3" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.5"/><text class="ts" x="152" y="664">sensör</text>
<rect x="215" y="652" width="14" height="14" rx="3" fill="#F0997B" stroke="#993C1D" stroke-width="0.5"/><text class="ts" x="237" y="664">eyleyici</text>
<rect class="box" x="310" y="652" width="14" height="14" rx="3" stroke-dasharray="3 2"/><text class="ts" x="332" y="664">planlanan (CAN_H / CAN_L hattı)</text>
</svg>
