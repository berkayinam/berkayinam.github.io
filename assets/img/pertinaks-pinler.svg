<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Pertinaks düzeni ve ESP32 pin bağlantıları</title><desc>Solda pertinaksın üstten görünüşü: ESP32, boşta bekleyen STM32, sensör baraları ve 12V, 5V, GND klemensleri. Sağda 30 pinli ESP32 DevKit pinleri ve her pinin nereye bağlandığı.</desc><style>
text{font-family:Inter,-apple-system,"Segoe UI",Arial,sans-serif}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.box{fill:#fff;stroke:#B4B2A9;stroke-width:0.5}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.leader{stroke:#888780;stroke-width:0.5;stroke-dasharray:3 3;fill:none}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.5}.c-purple>text.t,.c-purple>text.th{fill:#3C3489}.c-purple>text.ts{fill:#534AB7}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.5}.c-teal>text.t,.c-teal>text.th{fill:#085041}.c-teal>text.ts{fill:#0F6E56}
.c-coral>rect{fill:#FAECE7;stroke:#993C1D;stroke-width:0.5}.c-coral>text.t,.c-coral>text.th{fill:#712B13}.c-coral>text.ts{fill:#993C1D}
.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.5}.c-gray>text.t,.c-gray>text.th{fill:#444441}.c-gray>text.ts{fill:#5F5E5A}
.c-red>rect{fill:#FCEBEB;stroke:#A32D2D;stroke-width:0.5}.c-red>text.t,.c-red>text.th{fill:#791F1F}.c-red>text.ts{fill:#A32D2D}
</style>
<text class="ts" x="40" y="50">Pertinaks (üstten)</text>
<rect class="box" x="40" y="60" width="220" height="310" rx="6" stroke-dasharray="5 4"/>
<g class="c-purple"><rect x="60" y="80" width="180" height="64" rx="4"/><text class="th" x="150" y="106" text-anchor="middle">ESP32</text><text class="ts" x="150" y="126" text-anchor="middle">WiFi + kontrol beyni</text></g>
<g class="c-gray"><rect x="60" y="160" width="180" height="64" rx="4"/><text class="th" x="150" y="186" text-anchor="middle">STM32</text><text class="ts" x="150" y="206" text-anchor="middle">şimdilik boşta</text></g>
<g class="c-purple"><rect x="60" y="240" width="85" height="40" rx="4"/><text class="ts" x="102" y="265" text-anchor="middle">3V3 sensör</text></g>
<g class="c-gray"><rect x="155" y="240" width="85" height="40" rx="4"/><text class="ts" x="197" y="265" text-anchor="middle">GND sensör</text></g>
<g class="c-coral"><rect x="52" y="300" width="56" height="54" rx="4"/><text class="th" x="80" y="323" text-anchor="middle">12V</text><text class="ts" x="80" y="342" text-anchor="middle">5'li</text></g>
<g class="c-teal"><rect x="116" y="300" width="56" height="54" rx="4"/><text class="th" x="144" y="323" text-anchor="middle">5V</text><text class="ts" x="144" y="342" text-anchor="middle">5'li</text></g>
<g class="c-gray"><rect x="180" y="300" width="68" height="54" rx="4"/><text class="th" x="214" y="323" text-anchor="middle">GND</text><text class="ts" x="214" y="342" text-anchor="middle">5'li + 3'lü</text></g>
