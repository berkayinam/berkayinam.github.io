<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" role="img"><title>Safran kutusunun sade kurulumu (Ekim 2026)</title><desc>İçeride ATX güç kaynağı, ESP32 ve iki kanallı röle; balkondaki çiçeklenme kutusunda LED armatür, sirkülasyon fanı ve SHT31; kutunun dışında DHT22.</desc><style>
text{font-family:Inter,-apple-system,"Segoe UI",Arial,sans-serif}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.tl{font-size:12px;font-weight:600;fill:#5F5E5A;letter-spacing:.06em}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.dat{stroke:#0F6E56;stroke-width:1.2;stroke-dasharray:4 3;fill:none}
.win{stroke:#B4B2A9;stroke-width:1;stroke-dasharray:6 4}
.grp{fill:none;stroke:#B4B2A9;stroke-width:0.8;stroke-dasharray:4 3}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.5}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.5}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-coral>rect{fill:#FAECE7;stroke:#993C1D;stroke-width:0.5}.c-coral>.th{fill:#712B13}.c-coral>.ts{fill:#993C1D}
.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.5}.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="tl" x="40" y="22">İÇERİDE</text>
<g class="c-gray"><rect x="250" y="30" width="180" height="50" rx="4"/><text class="th" x="340" y="51" text-anchor="middle">Telefon</text><text class="ts" x="340" y="68" text-anchor="middle">safran.local paneli</text></g>
<line class="arr" x1="340" y1="80" x2="340" y2="108" marker-end="url(#a)"/>
<g class="c-gray"><rect x="40" y="110" width="150" height="56" rx="4"/><text class="th" x="115" y="133" text-anchor="middle">ATX PSU</text><text class="ts" x="115" y="152" text-anchor="middle">12V · 5V · GND</text></g>
<g class="c-purple"><rect x="230" y="110" width="220" height="56" rx="4"/><text class="th" x="340" y="133" text-anchor="middle">ESP32</text><text class="ts" x="340" y="152" text-anchor="middle">WiFi, web panel, zamanlama</text></g>
<line class="arr" x1="190" y1="138" x2="228" y2="138" marker-end="url(#a)"/>
<line class="arr" x1="340" y1="166" x2="340" y2="206" marker-end="url(#a)"/>
<path class="arr" d="M115 166 L115 234 L228 234" marker-end="url(#a)"/>
<g class="c-gray"><rect x="230" y="208" width="220" height="52" rx="4"/><text class="th" x="340" y="230" text-anchor="middle">Röle kartı: 2 kanal</text><text class="ts" x="340" y="248" text-anchor="middle">IN1 GPIO25 · IN2 GPIO26</text></g>

<line class="win" x1="20" y1="290" x2="660" y2="290"/>
<text class="ts" x="650" y="284" text-anchor="end">pencere</text>
<text class="tl" x="40" y="312">BALKONDA</text>

<rect class="grp" x="40" y="322" width="440" height="168" rx="8"/>
<text class="ts" x="56" y="342">Çiçeklenme kutusu</text>
<path class="arr" d="M300 260 L300 304 L155 304 L155 356" marker-end="url(#a)"/>
<line class="arr" x1="365" y1="260" x2="365" y2="356" marker-end="url(#a)"/>
<g class="c-coral"><rect x="60" y="358" width="190" height="56" rx="4"/><text class="th" x="155" y="381" text-anchor="middle">LED armatür</text><text class="ts" x="155" y="400" text-anchor="middle">220 V, 22:00–10:00</text></g>
<g class="c-coral"><rect x="270" y="358" width="190" height="56" rx="4"/><text class="th" x="365" y="381" text-anchor="middle">Sirkülasyon fanı</text><text class="ts" x="365" y="400" text-anchor="middle">her 30 dk'nın 15'i</text></g>
<g class="c-gray"><rect x="60" y="426" width="190" height="50" rx="4"/><text class="th" x="155" y="447" text-anchor="middle">Tekne</text><text class="ts" x="155" y="464" text-anchor="middle">18 korm, substrat</text></g>
<g class="c-teal"><rect x="270" y="426" width="190" height="50" rx="4"/><text class="th" x="365" y="447" text-anchor="middle">SHT31 kutu içi</text><text class="ts" x="365" y="464" text-anchor="middle">I2C, GPIO21 / 22</text></g>
<g class="c-teal"><rect x="510" y="358" width="140" height="56" rx="4"/><text class="th" x="580" y="381" text-anchor="middle">DHT22 dış hava</text><text class="ts" x="580" y="400" text-anchor="middle">GPIO13</text></g>
<path class="dat" d="M460 451 L488 451 L488 152 L454 152" marker-end="url(#d)"/>
<path class="dat" d="M580 358 L580 124 L454 124" marker-end="url(#d)"/>

<g transform="translate(40 522)">
<rect width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="ts" x="18" y="10">kontrol</text>
<rect x="90" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="ts" x="108" y="10">sensör</text>
<rect x="175" width="12" height="12" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text class="ts" x="193" y="10">röleyle açılıp kapanan</text>
<line x1="345" y1="6" x2="375" y2="6" class="dat"/><text class="ts" x="382" y="10">sensör verisi</text>
</g>
</svg>
