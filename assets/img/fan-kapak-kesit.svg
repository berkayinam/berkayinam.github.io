<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 640" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Duvara gömülü fan ve tıpa gibi kapanan kapak</title><desc>5 cm strafor duvarın dış yüzüne 2,5 cm derinliğinde fan gömülü; kalan 2,5 cm strafor eğik kesilerek kapak yapılmış, iç yüzde bant menteşeli. Üstte kapalı, altta fan açıkken içe açılmış hali.</desc><style>
text{font-family:Inter,-apple-system,"Segoe UI",Arial,sans-serif}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.box{fill:#fff;stroke:#B4B2A9;stroke-width:0.5}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.leader{stroke:#888780;stroke-width:0.5;stroke-dasharray:3 3;fill:none}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.5}.c-purple>text.t,.c-purple>text.th{fill:#3C3489}.c-purple>text.ts{fill:#534AB7}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.5}.c-teal>text.t,.c-teal>text.th{fill:#085041}.c-teal>text.ts{fill:#0F6E56}
.c-coral>rect{fill:#FAECE7;stroke:#993C1D;stroke-width:0.5}.c-coral>text.t,.c-coral>text.th{fill:#712B13}.c-coral>text.ts{fill:#993C1D}
.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.5}.c-gray>text.t,.c-gray>text.th{fill:#444441}.c-gray>text.ts{fill:#5F5E5A}
.c-red>rect{fill:#FCEBEB;stroke:#A32D2D;stroke-width:0.5}.c-red>text.t,.c-red>text.th{fill:#791F1F}.c-red>text.ts{fill:#A32D2D}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="40" y="50">Giriş deliği, fan kapalı: kapak basamağa oturur</text>
<text class="ts" x="120" y="100" text-anchor="middle">kutu içi</text>
<text class="ts" x="340" y="300">dışarı</text>
<polygon points="250,70 310,70 310,140 280,140 280,146 250,138" fill="#D3D1C7" stroke="#888780" stroke-width="0.5"/>
<polygon points="250,238 280,230 280,236 310,236 310,310 250,310" fill="#D3D1C7" stroke="#888780" stroke-width="0.5"/>
<polygon points="250,138 280,146 280,230 250,238" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<rect x="284" y="146" width="24" height="84" rx="2" fill="#5F5E5A"/>
<rect x="243" y="132" width="7" height="12" rx="1" fill="#888780"/>
<line class="leader" x1="190" y1="131" x2="242" y2="137"/><text class="ts" x="40" y="134">bant menteşe (iç yüz)</text>
<line class="leader" x1="236" y1="192" x2="249" y2="192"/><text class="ts" x="40" y="196">kesilen parça = kapak</text>
<line class="leader" x1="270" y1="143" x2="392" y2="124"/><text class="ts" x="398" y="120">eğik kesim + 0,5 cm basamak:</text><text class="ts" x="398" y="136">kapak dışarı geçemez</text>
<line class="leader" x1="309" y1="190" x2="392" y2="190"/><text class="ts" x="398" y="194">fan: dış yüzden 2,5 cm gömülü</text>
<text class="ts" x="398" y="240">5 cm duvar = 2,5 cm fan cebi</text>
<text class="ts" x="398" y="256">+ 2,5 cm strafor kapak</text>
<text class="th" x="40" y="350">Fan açık: hava kapağı içeri iter</text>
<text class="ts" x="100" y="400" text-anchor="middle">kutu içi</text>
<text class="ts" x="340" y="600">dışarı</text>
<polygon points="250,370 310,370 310,440 280,440 280,446 250,438" fill="#D3D1C7" stroke="#888780" stroke-width="0.5"/>
<polygon points="250,538 280,530 280,536 310,536 310,610 250,610" fill="#D3D1C7" stroke="#888780" stroke-width="0.5"/>
<polygon points="250,438 258,468 185,510 163,488" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<rect x="284" y="446" width="24" height="84" rx="2" fill="#5F5E5A"/>
<rect x="243" y="432" width="7" height="12" rx="1" fill="#888780"/>
<line x1="380" y1="488" x2="314" y2="488" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="246" y1="522" x2="176" y2="566" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="398" y="560">fan durunca kapak kendi</text>
<text class="ts" x="398" y="576">ağırlığıyla geri düşer</text>
</svg>
